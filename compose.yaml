name: garmin-mcp

services:
  garmin-login:
    build:
      context: .
    image: personal-garmin-mcp:local
    entrypoint: ["garmin-mcp-login"]
    environment:
      GARMIN_TOKEN_DIR: /data/garmin-tokens
    volumes:
      - garmin_tokens:/data/garmin-tokens
    stdin_open: true
    tty: true
    profiles: ["login"]
    security_opt:
      - no-new-privileges:true

  garmin-mcp:
    build:
      context: .
    image: personal-garmin-mcp:local
    environment:
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: 8000
      GARMIN_TOKEN_DIR: /data/garmin-tokens
      GARMIN_DATA_DIR: /data/garmin-app
      GARMIN_ACCOUNT_ID: ${GARMIN_ACCOUNT_ID:-personal}
      GARMIN_TIMEZONE: ${GARMIN_TIMEZONE:-Europe/Berlin}
      GARMIN_OVERLAP_DAYS: ${GARMIN_OVERLAP_DAYS:-7}
      GARMIN_BACKUP_ENABLED: ${GARMIN_BACKUP_ENABLED:-true}
      GARMIN_BACKUP_TIME: ${GARMIN_BACKUP_TIME:-03:00}
    volumes:
      - garmin_tokens:/data/garmin-tokens
      - ${GARMIN_DATA_DIR:-./.garmin-data}:/data/garmin-app
      - ./src/garmin_mcp/features:/app/src/garmin_mcp/features:ro
      - ./src/garmin_mcp/migrations:/app/src/garmin_mcp/migrations:ro
    ports:
      - "127.0.0.1:${GARMIN_MCP_PORT:-8765}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  datasette:
    build:
      context: .
      target: datasette
    image: personal-garmin-datasette:local
    depends_on:
      garmin-mcp:
        condition: service_healthy
    volumes:
      # Mount the directory so SQLite can also read the live WAL and SHM files.
      - ${GARMIN_DATA_DIR:-./.garmin-data}:/data/garmin-app:ro
    ports:
      - "127.0.0.1:${GARMIN_DB_UI_PORT:-8766}:8001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/garmin.json', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  garmin_tokens:
