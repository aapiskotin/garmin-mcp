<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training planner · Garmin local</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#162d32;--muted:#617376;--paper:#f4f5f0;--line:#dbe2db;--green:#16695c;--light:#e6f1e9;--amber:#89601e;--orange:#f8edd7;--red:#a43d3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}header{background:#142f34;color:white;padding:22px max(24px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header a{color:#c6e8d9}header strong{font-size:19px;letter-spacing:-.5px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--muted)}header .eyebrow{color:#a0c3bb}main{max-width:1450px;margin:auto;padding:32px 24px 64px}h1{font-size:36px;letter-spacing:-1.3px;line-height:1.2;margin:8px 0 12px}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 18px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0 14px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 14px;font-weight:600}button:hover{border-color:var(--green);background:#edf5ee}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#115749;color:white}.danger{color:var(--red)}.small{font-size:12px;padding:5px 9px}.quiet{background:transparent}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:24px}.hero p{max-width:800px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:24px 0}.tabs button{border:0;background:none;border-radius:0;padding:14px 18px;color:var(--muted)}.tabs button.active{color:var(--green);box-shadow:inset 0 -3px var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{min-height:280px;background:#eaf0e9;border:1px solid var(--line);border-radius:12px;padding:12px 9px}.day.today{border:2px solid var(--green);padding:11px 8px}.day-head{font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.day-head strong{font-size:21px}.session{background:white;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px;margin:10px 0;padding:12px 10px;font-size:13px}.session.cancelled{opacity:.65;border-left-color:#7d8580}.session.rest{border-left-color:#98a899}.session h3{font-size:15px}.session p{margin:6px 0;overflow-wrap:anywhere}.session button{font-size:11px;padding:4px 6px;margin:3px 2px 0 0}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:5px;background:var(--light);color:var(--green);font-weight:600}.badge.unknown,.badge.tentative{background:#eff1f0;color:#677576}.badge.partial,.badge.needs_review{background:var(--orange);color:var(--amber)}.badge.skipped,.badge.cancelled{background:#f6e6e3;color:var(--red)}.notice{padding:14px 18px;border-radius:9px;background:var(--orange);color:#694b20;border:1px solid #ead9b4;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fae9e5;color:var(--red);border-color:#e9c1b9}.notice.success{background:var(--light);color:var(--green);border-color:#c2dace}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat strong{font-size:28px;font-weight:650;display:block;letter-spacing:-.6px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.empty{padding:65px 25px;text-align:center;border:1px dashed #b8c9bf;border-radius:14px;max-width:900px;margin:50px auto}.empty h1{font-size:33px}.empty p{max-width:560px;margin:16px auto 24px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}.table-wrap{overflow:auto}details{margin:12px 0}summary{cursor:pointer;color:var(--green);font-weight:600}.entry{padding:16px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry p{white-space:pre-wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.before{background:#fbefeb;padding:12px;border-radius:8px}.after{background:var(--light);padding:12px;border-radius:8px}dl{margin:0}dt{font-size:11px;color:var(--muted);margin-top:8px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}dialog{border:0;border-radius:16px;padding:0;box-shadow:0 30px 100px #102f3355;width:min(780px,94vw);max-height:90vh;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0e242c88}dialog .dialog-head{padding:22px 26px;border-bottom:1px solid var(--line);background:white}dialog .dialog-body{padding:24px 26px}dialog h2{margin:0}form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:flex;flex-direction:column;font-size:12px;font-weight:600;gap:6px;min-width:0}.full{grid-column:1/-1}input,select,textarea{width:100%;background:white;border:1px solid #c4d0c7;border-radius:7px;padding:9px 10px;color:var(--ink);min-width:0}textarea{min-height:80px;resize:vertical}.help{font-size:12px;color:var(--muted);font-weight:400}.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}pre{white-space:pre-wrap;word-break:break-word}.compact{font-size:12px}.work-block,.variant{border:1px solid var(--line);padding:14px;border-radius:9px;margin-top:12px;background:#fff}.work-step{border-top:1px solid var(--line);margin:12px 0;padding-top:12px}.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.link-button{border:0;background:none;color:var(--green);padding:0;text-decoration:underline}.loader{padding:80px;text-align:center;color:var(--muted)}:focus-visible{outline:3px solid #9ccbb0;outline-offset:2px}footer{margin-top:24px;font-size:12px;color:var(--muted)}
@media(max-width:1100px){.calendar{grid-template-columns:repeat(4,minmax(0,1fr))}.day{min-height:200px}}@media(max-width:700px){header{padding:18px;align-items:start}main{padding:24px 14px}.hero{display:block}.calendar{grid-template-columns:1fr}.day{min-height:90px}.stats,.grid{grid-template-columns:1fr}.tabs{overflow:auto}.tabs button{white-space:nowrap;padding:12px}.fields,.split{grid-template-columns:1fr!important}.full{grid-column:auto}h1{font-size:29px}.steps-grid{grid-template-columns:1fr 1fr}dialog .dialog-body{padding:18px}.day-head{margin-bottom:6px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">Garmin · Local workspace</div><strong>Training planner</strong></div><nav class="row"><a href="/home">Home</a><a href="/">Saved activities</a><a href="/docs">API</a></nav></header>
<main><div id="message" role="status" aria-live="polite"></div><div id="app"><div class="loader">Loading your plans…</div></div><footer>Plans and notes are saved on this computer. Garmin data refreshes only when requested. Saving a plan does not publish workouts.</footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head row between"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">×</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<script>
'use strict';
const $ = s => document.querySelector(s);
const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h = escapeHtml, uid = () => crypto.randomUUID(), copy = v => structuredClone(v);
let cycles=[], loaded=null, report=null, overview=null, week=null, view='week', zone='Europe/Berlin';
let actions=new Map(), actionNo=0;
const kinds={easy:'Easy run',long:'Long run',intervals:'Intervals',tempo:'Tempo',race:'Race',strength:'Strength',other:'Other activity',rest:'Rest'};
const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtDate = d => new Intl.DateTimeFormat('en',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
function plus(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function monday(d){const x=new Date(d+'T12:00:00Z');return plus(d,-((x.getUTCDay()+6)%7))}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function badge(v){return `<span class="badge ${h(v)}">${h(v.replaceAll('_',' '))}</span>`}
function button(label,fn,cls='small'){const key=String(++actionNo);actions.set(key,fn);return `<button type="button" class="${h(cls)}" data-action="${key}">${h(label)}</button>`}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b)guard(()=>actions.get(b.dataset.action)?.(),b)});
async function guard(fn,b){if(b)b.disabled=true;try{await fn()}catch(e){showError(e)}finally{if(b)b.disabled=false}}
function notify(text,error=false){$('#message').innerHTML=`<div class="notice ${error?'error':'success'}">${h(text)}</div>`}
function showError(e){const text=e.message||String(e);if($('#dialog').open){let n=$('#dialog-error');if(!n){n=document.createElement('div');n.id='dialog-error';$('#dialog-body').prepend(n)}n.innerHTML=`<div class="notice error">${h(text)}</div>`;n.scrollIntoView({block:'nearest'})}else notify(text,true)}
async function api(path,method='GET',body){const res=await fetch('/api/training'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let data=await res.json();if(!res.ok){const extra=data.errors?.map(e=>e.loc.join('.')+': '+e.message).join('\n')||data.warnings?.map(w=>w.message).join('\n');throw new Error((data.message||'Request failed')+(extra?'\n'+extra:''))}return data}
const path = () => '/cycles/'+loaded.cycle.id;
const meta = reason => ({author:'user',reason,expected_revision_id:loaded.cycle.current_revision_id});
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal()}
$('#close-dialog').onclick=()=>$('#dialog').close();
function close(){ $('#dialog').close() }
function metric(v,unit){return v==null?'Unknown':unit==='m'?(v/1000).toLocaleString('en',{maximumFractionDigits:2})+' km':Math.round(v/60)+' min'}
function knownTotal(t,unit){return t.value==null&&t.known_sum===0?'Unknown':metric(t.known_sum,unit)+(t.complete?'':' known')}
function range(low,high,unit){if(low==null&&high==null)return 'Not specified';if(low===high)return metric(low,unit);return (low==null?'?':metric(low,unit))+' – '+(high==null?'?':metric(high,unit))}
function targets(s){return s.variants?.find(v=>v.id===s.selected_variant_id)||s}
function targetText(s){if(s.kind==='rest')return 'Recovery day';const t=targets(s);return [t.distance_min_m!=null||t.distance_max_m!=null?range(t.distance_min_m,t.distance_max_m,'m'):null,t.duration_min_s!=null||t.duration_max_s!=null?range(t.duration_min_s,t.duration_max_s,'s'):null].filter(Boolean).join(' · ')||'Targets not specified'}
function goalText(c){return c.goal_type==='target_time'?`Target time: ${metric(c.target_time_s,'s')}`:c.goal_type==='finish'?'Finish the event':c.goal_description||'Personal goal'}
async function boot(preferred){const data=await api('/cycles');cycles=data.cycles;zone=data.timezone;if(cycles.length){const selected=cycles.find(c=>c.id===preferred)||cycles.find(c=>c.status==='active')||cycles.at(-1);await load(selected.id)}else{loaded=null;render()}}
async function load(id,revision){loaded=await api('/cycles/'+id+(revision?'?revision_id='+encodeURIComponent(revision):''));zone=loaded.snapshot.cycle.timezone;week=week||monday(today());await refreshReports();render()}
async function refreshReports(){if(!loaded)return;report=await api(path()+`/context?start_date=${week}&end_date=${plus(week,6)}`);overview=await api(path()+'/context')}
function editable(){return loaded.revision.status==='draft'||loaded.revision.id===loaded.cycle.current_revision_id}
function render(){
 actions.clear();const app=$('#app');
 if(!loaded){app.innerHTML=`<div class="empty"><div class="eyebrow">A plan that stays with you</div><h1>One goal. A clear next week.</h1><p class="muted">Create a training cycle around your main race. Keep the whole preparation in view, then add detail to the weeks ahead.</p>${button('Create a training cycle',newCycle,'primary')}</div>`;return}
 const c=loaded.snapshot.cycle,isDraft=loaded.revision.status==='draft',historical=!editable();
 app.innerHTML=`<div class="hero"><div><div class="eyebrow">${h(c.status)} cycle · ${h(c.timezone)}</div><h1>${h(c.name)}</h1><p>${h(goalText(c))}${c.goal_description?' · '+h(c.goal_description):''}</p><span class="muted">${fmtDate(c.start_date)} — ${fmtDate(c.end_date)}</span></div><div class="row"><label>Training cycle<select id="cycle-select">${cycles.map(x=>`<option value="${h(x.id)}" ${x.id===loaded.cycle.id?'selected':''}>${h(x.name)} · ${h(x.status)}</option>`).join('')}</select></label>${button('New cycle',newCycle,'quiet')}</div></div>
 ${isDraft?`<div class="notice"><strong>Draft version ${loaded.revision.number}</strong> · ${h(loaded.revision.reason)}<p>Edits here remain a proposal until you apply this version.</p><div class="row">${button('Review and apply',()=>reviewDraft(loaded.revision.id),'primary')}${button('Discard draft',discardDraft)}${button('Return to current plan',()=>load(loaded.cycle.id))}</div></div>`:historical?`<div class="notice">Viewing historical version ${loaded.revision.number}. ${button('Return to current plan',()=>load(loaded.cycle.id))}${button('Use as a new draft',restoreDraft)}</div>`:''}
 <nav class="tabs" aria-label="Planner views">${[['week','Today & week'],['cycle','Whole preparation'],['review','Weekly review'],['history','Versions & notes']].map(([id,label])=>button(label,()=>{view=id;render()},view===id?'active':'')).join('')}</nav><div id="content"></div>`;
 $('#cycle-select').onchange=e=>{week=null;guard(()=>load(e.target.value))};
 ({week:renderWeek,cycle:renderCycle,review:renderReview,history:renderHistory})[view]();
}
function periodControls(){return `<div class="row between" style="margin-bottom:20px"><div class="row">${button('←',()=>changeWeek(-7))}<h2 style="margin:0">${fmtDate(week)} — ${fmtDate(plus(week,6))}</h2>${button('→',()=>changeWeek(7))}</div><div class="row">${button('Today',async()=>{week=monday(today());await refreshReports();render()})}${button('Refresh Garmin data',refreshGarmin)}</div></div>`}
async function changeWeek(n){week=plus(week,n);await refreshReports();render()}
function coverageNotice(r){const q=r.source_quality;const missing=q.missing_activity_dates.length;const stale=q.sync.filter(s=>s.source==='activities').some(s=>s.stale);return `<div class="notice"><strong>${missing?'Activity coverage is incomplete':stale?'Activity data may be stale':'Activity range has been imported'}</strong><br>${missing?`${missing} day(s) are not covered. Totals below show known records, not a complete week. `:''}${stale?'Refresh explicitly for recent uploads. ':''}Missing health sources: ${h(Object.keys(q.missing_daily_sources).join(', ')||'none')}.<details><summary>Source coverage and freshness</summary>${q.sync.map(s=>`<p class="compact">${h(s.source)} · ${h(s.status)} · last successful boundary ${h(s.cursor||'never')} · ${s.stale?'stale':'recent'}</p>`).join('')||'<p>No Garmin data has been requested.</p>'}<p class="compact">${h(q.message)}</p></details></div>`}
function renderWeek(){
 const ss=loaded.snapshot.sessions,ww=loaded.snapshot.weeks.find(w=>w.start_date===week);
 const actual=new Map(report.sessions.map(s=>[s.id,s]));const constraints=loaded.snapshot.constraints.filter(c=>c.start_date<=plus(week,6)&&c.end_date>=week);
 $('#content').innerHTML=periodControls()+`<div class="row between" style="margin-bottom:16px"><p class="muted">${ww?`${ww.detail==='outline'?'Outline week — details are still to come':'Scheduled week'}${ww.focus?' · '+h(ww.focus):''}`:'This week has not been planned.'}</p>${editable()?button(ww?'Edit week':'Plan this week',()=>editEntity('weeks',ww||{start_date:week,detail:'outline'})):''}</div>${constraints.length?`<div class="panel compact"><strong>Availability this week</strong>${constraints.map(c=>`<p>${h(c.name)} · ${h(c.sport||'All sports')} · ${fmtDate(c.start_date)} — ${fmtDate(c.end_date)}<br>${h(c.limitations||c.preferences||'')}${c.available_days!==null?' · Available: '+(c.available_days.map(x=>dayNames[x]).join(', ')||'no days'):''}${c.daily_budget_s!=null?' · '+metric(c.daily_budget_s,'s')+' per day':''}</p>`).join('')}</div>`:''}<div class="calendar">${Array.from({length:7},(_,i)=>{const d=plus(week,i),items=ss.filter(s=>s.date===d).sort((a,b)=>a.order_in_day-b.order_in_day);return `<section class="day ${d===today()?'today':''}"><div class="day-head"><span>${dayNames[i]}</span><strong>${Number(d.slice(-2))}</strong></div>${loaded.snapshot.events.filter(e=>e.date===d).map(e=>`<p class="badge">${h(e.name)}</p>`).join('')}${items.length?items.map(s=>sessionCard(s,actual.get(s.id))).join(''):'<p class="muted compact">No plan yet</p>'}${editable()&&d>=loaded.snapshot.cycle.start_date&&d<=loaded.snapshot.cycle.end_date?button('+ Session',()=>editSession(null,d)):''}</section>`}).join('')}</div>${sportVolumes(report.weeks[0])}${coverageNotice(report)}`;
}
function structureView(structure){if(!structure)return '';return `<details><summary>Workout structure</summary>${structure.instructions?`<p>${h(structure.instructions)}</p>`:''}${structure.workout?.blocks.map(b=>`<p><strong>${b.repeat}×</strong><br>${b.steps.map(s=>`${h(s.step_type)} · ${s.duration_type==='lap_button'?'until lap button':metric(s.duration_value,s.duration_type==='distance'?'m':'s')}${s.target_type==='none'?'':' · '+h(s.target_type.replaceAll('_',' '))+' '+h(s.zone_number??`${s.target_low}–${s.target_high}`)}${s.notes?' · '+h(s.notes):''}`).join('<br>')}</p>`).join('')||''}</details>`}
function sessionCard(s,a){const actual=a?.actual;return `<article class="session ${h(s.state)} ${s.kind==='rest'?'rest':''}"><div class="row between"><h3>${h(kinds[s.kind])}</h3>${badge(s.certainty)}</div>${s.state==='cancelled'?badge('cancelled'):badge(actual?.status||'unknown')}${s.start_time||s.timezone!==zone?`<p class="compact muted">${h(s.start_time||'')} ${h(s.timezone)}</p>`:''}<p><strong>${h(targetText(s))}</strong></p>${s.purpose?`<p>${h(s.purpose)}</p>`:''}${s.replaces_session_id?`<p class="muted">Replaces a cancelled session</p>`:''}${s.selected_variant_id?`<p>Option: ${h(targets(s).name)}</p>`:''}${structureView(targets(s).structure)}${s.kind!=='rest'?`<p class="muted">Actual: ${metric(actual?.distance_m,'m')} · ${metric(actual?.duration_s,'s')}</p>`:''}${actual?.limitations?.map(l=>`<p class="compact muted">${h(l)}</p>`).join('')||''}${a?.outcome?.comment?`<p>${h(a.outcome.comment)}</p>`:''}${actual?`<p class="compact muted">Source: ${h(actual.source.replaceAll('_',' '))}${a?.outcome?.actual_date?' · '+fmtDate(a.outcome.actual_date):''}</p>`:''}${a?.feedback?.map(f=>`<p>${f.effort?'Effort '+f.effort+'/10 · ':''}${h(f.wellbeing)} ${h(f.comment)}</p>`).join('')||''}${editable()?`<div>${button('Edit / move',()=>editSession(s))}${button('Record result',()=>editOutcome(s,a))}${button('Feedback',()=>editFeedback(s,a))}${s.kind!=='rest'?button('Link activity',()=>matchActivity(s,a)):''}${s.state!=='cancelled'?button('Cancel',()=>cancelSession(s)):''}${s.state!=='cancelled'&&s.kind!=='rest'?button('Replace',()=>replaceSession(s)):''}</div>`:''}</article>`}
function renderCycle(){const s=loaded.snapshot;$('#content').innerHTML=`<div class="stats"><div class="stat"><span>Main goal</span><strong>${h(s.events.find(e=>e.id===s.cycle.main_event_id)?.name||'Not set')}</strong><span>${h(goalText(s.cycle))}</span></div><div class="stat"><span>Preparation</span><strong>${s.weeks.length} weeks</strong><span>${s.weeks.filter(w=>w.detail==='outline').length} outlined · ${s.sessions.filter(x=>x.state!=='cancelled'&&x.kind!=='rest').length} training sessions</span></div><div class="stat"><span>Plan history</span><strong>Version ${loaded.revision.number}</strong><span>${h(loaded.revision.reason)}</span></div></div><div class="panel"><div class="row between"><h2>Goal & principles</h2>${editable()?button('Edit',()=>editEntity('cycle',s.cycle)):''}</div><p>${h(s.cycle.principles||'No training principles recorded yet.')}</p>${['active','draft'].includes(s.cycle.status)&&editable()?`<div class="row">${button('Complete cycle',()=>finishCycle('completed'))}${button('Cancel cycle',()=>finishCycle('cancelled'),'small danger')}</div>`:''}</div><div class="grid">${[['events','Events'],['constraints','Availability & constraints'],['phases','Training phases']].map(([group,title])=>`<section class="panel"><div class="row between"><h2>${title}</h2>${editable()?button('+ Add',()=>editEntity(group)):''}</div>${s[group].map(e=>`<div class="entry"><div class="row between"><h3>${h(e.name)}</h3>${editable()?button('Edit',()=>editEntity(group,e)):''}</div><p>${h(e.date||[e.start_date,e.end_date].filter(Boolean).join(' — ')||'Date not decided')}</p>${e.role?badge(e.role)+' '+badge(e.participation):''}<p class="muted">${h(e.notes||e.limitations||e.objective||'')}</p>${group==='constraints'?`<p class="compact">${h(e.sport||'All sports')} · Available: ${e.available_days===null?'unspecified':e.available_days.map(x=>dayNames[x]).join(', ')||'no days'} · Daily budget: ${metric(e.daily_budget_s,'s')}</p>`:''}</div>`).join('')||'<p class="muted">None yet.</p>'}</s function captureWorkout(){const form=$('#editor');workoutBlocks=workoutBlocks.map((b,i)=>({repeat:Number(form.elements.namedItem('repeat-'+i).value),steps:b.steps.map((s,j)=>{const v=readFields(form,stepFields,`step-${i}-${j}-`);if(v.duration_type==='lap_button')v.duration_value=null;if(v.target_type==='none'){v.target_low=null;v.target_high=null;v.zone_number=null}else if(v.target_type==='heart_rate_zone'){v.target_low=null;v.target_high=null}else v.zone_number=null;return v})}))}
function readWorkout(){captureWorkout();const instructions=$('#workout-instructions').value;if(!workoutBlocks.length&&!instructions)return null;return {schema_version:1,instructions,workout:workoutBlocks.length?{...workoutTemplate,name:workoutTemplate?.name||kinds[$('#editor').elements.kind.value],sport:$('#editor').elements.sport.value,blocks:workoutBlocks}:null}}
function initVariants(values,selected){variants=copy(values);renderVariants(selected)}
const variantFields=[field('name','Option name','text',{required:true}),...targetFields.slice(0,4)];
function captureVariants(){const form=$('#editor');variants=variants.map((v,i)=>({...v,...readFields(form,variantFields,`variant-${i}-`)}))}
function renderVariants(selected){$('#variants-editor').innerHTML=variants.map((v,i)=>`<div class="variant"><div class="fields">${fieldsHtml(variantFields,v,`variant-${i}-`)}</div>${button('Remove option',()=>{captureVariants();const chosen=$('#selected-variant').value;variants.splice(i,1);renderVariants(chosen)})}</div>`).join('');$('#selected-variant').innerHTML='<option value="">Use base targets (no alternatives)</option>'+variants.map(v=>`<option value="${h(v.id)}" ${v.id===selected?'selected':''}>${h(v.name||'New option')}</option>`).join('')}
function addVariant(){captureVariants();const chosen=$('#selected-variant').value;variants.push({id:uid(),name:'Alternative'});renderVariants(chosen)}
function readVariants(){captureVariants();return variants}
function sportVolumes(w){
 if(!w?.by_sport)return '';
 return `<section class="panel"><h2>Volume by sport</h2><div class="table-wrap"><table><thead><tr><th>Sport</th><th>Planned distance</th><th>Recorded distance</th><th>Planned time</th><th>Recorded time</th></tr></thead><tbody>${Object.entries(w.by_sport).map(([sport,v])=>`<tr><td>${h(sport)}</td><td>${range(v.scheduled_totals.distance_min_m.value,v.scheduled_totals.distance_max_m.value,'m')}</td><td>${knownTotal(v.actual_totals.distance_m,'m')}</td><td>${range(v.scheduled_totals.duration_min_s.value,v.scheduled_totals.duration_max_s.value,'s')}</td><td>${knownTotal(v.actual_totals.duration_s,'s')}</td></tr>`).join('')}</tbody></table></div><p>Total time across all sports: ${knownTotal(w.all_sports_totals.actual_totals.duration_s,'s')}</p></section>`;
}
function replaceSession(s){
 const fields=[field('sport','Replacement sport','text',{required:true}),field('kind','Session type','select',{options:Object.entries(kinds).filter(([k])=>k!=='rest').map(([value,label])=>({value,label}))}),field('duration_min_s','Duration from (minutes)','number',{scale:60,min:0}),field('duration_max_s','Duration to (minutes)','number',{scale:60,min:0}),field('purpose','Purpose and instructions','textarea'),reasonField];
 formDialog('Replace session',fields,{sport:s.sport==='running'?'cycling':'running',kind:'other'},async v=>{
  const snapshot=copy(loaded.snapshot),old=snapshot.sessions.find(x=>x.id===s.id),reason=v.reason;delete v.reason;old.state='cancelled';
  snapshot.sessions.push({id:uid(),week_id:old.week_id,date:old.date,start_time:old.start_time,timezone:old.timezone,order_in_day:old.order_in_day,certainty:old.certainty,state:'planned',replaces_session_id:old.id,...v});
  await saveSnapshot(snapshot,reason);
 },'<p>The original assignment stays cancelled in the plan. The replacement counts only toward its own sport. Existing Garmin calendar entries are not changed.</p>','Save replacement');
}
function cancelSession(s){formDialog('Cancel this session',[reasonField],{},async v=>{const snapshot=copy(loaded.snapshot);snapshot.sessions.find(x=>x.id===s.id).state='cancelled';await saveSnapshot(snapshot,v.reason)},'<p>The assignment stays in plan history. Cancelling it does not mark it skipped or remove Garmin activities.</p>','Save cancellation')}
function editOutcome(s,enriched){
 const outcome=enriched?.outcome;const revision=outcome?.session_revision_id||enriched?.actual?.assessment_revision_id||loaded.cycle.current_revision_id;
 const fields=[field('status','Execution','select',{options:['unknown','completed','partial','skipped']}),field('actual_date','Actual date','date',{required:true}),field('metrics_source','Metrics source','select',{options:s.kind==='rest'?['none']:['manual','garmin','none']}),field('distance_m','Actual distance (km)','number',{scale:1000,min:0}),field('duration_s','Actual duration (minutes)','number',{scale:60,min:0}),field('deviation_reason','Reason for deviation','textarea'),field('comment','Comment','textarea'),reasonField];
 formDialog('Record '+(s.kind==='rest'?'rest compliance':'execution'),fields,{status:'completed',actual_date:s.date,metrics_source:s.kind==='rest'?'none':'manual',reason:'Execution update',...outcome},async v=>{
  if(v.metrics_source!=='manual'){v.distance_m=null;v.duration_s=null}await api(path()+'/outcomes','PUT',{...meta(v.reason),...v,expected_version:outcome?.version||0,session_id:s.id,session_revision_id:revision});close();await refreshReports();render();notify('Execution saved. Planned targets are unchanged.');
 },'<p class="help">When linked to Garmin, manual metrics remain available for session assessment but are not added again to weekly totals. Choosing Garmin requires an activity link.</p>');
}
function editFeedback(s,enriched){const previous=enriched?.feedback?.[0],fields=[field('date','Date','date',{required:true}),field('effort','Effort (1–10)','number',{min:1,max:10}),field('wellbeing','How did you feel?','text'),field('comment','Comment','textarea'),reasonField];const id=previous?.id||uid();formDialog('Feedback',fields,{date:s?.date||today(),reason:'Feedback update',...previous},async v=>{await api(path()+'/feedback','PUT',{...meta(v.reason),...v,id,session_id:s?.id||null,expected_version:previous?.version||0});close();await refreshReports();render();notify('Feedback saved with its edit history.')})}
async function matchActivity(s,enriched){const candidates=await api(path()+`/sessions/${s.id}/candidates`),links=enriched?.matches||[],revision=enriched?.actual?.assessment_revision_id||loaded.cycle.current_revision_id;modal('Match activities',`<p>${h(kinds[s.kind])} · ${fmtDate(s.date)}. Review time, sport, and distance before confirming.</p><p class="help">A shared activity needs explicit distance and time allocations for every linked session. Until then, session comparisons remain incomplete.</p><h3>Existing links</h3>${links.map(m=>`<div class="entry">Activity ${m.activity_id} · ${badge(m.state)}<p>${h(m.basis)}</p>${button('Edit allocation or state',()=>editMatch(s,revision,m))}</div>`).join('')||'<p class="muted">No links.</p>'}<h3>Candidates from saved data</h3>${candidates.candidates.map(a=>`<div class="entry"><strong>${h(a.name||'Activity '+a.activity_id)}</strong><p>${fmtDate(a.date)} · ${h(a.sport||'Unknown sport')} · ${metric(a.distance_m,'m')} · ${metric(a.duration_s,'s')}</p><p class="compact muted">Start UTC: ${h(a.start_time_utc||'unknown')} · ${h(a.basis)}</p>${button('Review link',()=>editMatch(s,revision,links.find(m=>m.activity_id===a.activity_id)||{id:uid(),activity_id:a.activity_id,basis:a.basis,state:'confirmed'}))}</div>`).join('')||'<p class="muted">No nearby saved activities. Refresh Garmin data explicitly if needed.</p>'}${button('Link by activity ID',()=>editMatch(s,revision,{id:uid(),state:'confirmed'}))}`)}
function editMatch(s,revision,m){const fields=[field('activity_id','Garmin activity ID','number',{min:1,required:true}),field('state','Matching state','select',{options:['confirmed','rejected','needs_review','suggested']}),field('allocated_distance_m','Allocated distance (km)','number',{scale:1000,min:0}),field('allocated_duration_s','Allocated duration (minutes)','number',{scale:60,min:0}),field('basis','Why does this activity belong to the session?','textarea',{required:true}),reasonField];formDialog('Activity link & allocation',fields,{reason:'Reviewed activity match',...m},async v=>{await api(path()+'/matches','PUT',{...meta(v.reason),...v,id:m.id,expected_version:m.version||0,session_id:s.id,session_revision_id:m.session_revision_id||revision});close();await refreshReports();render();notify('Activity link saved. Weekly totals count each activity once.')})}
function editReview(previous){const fields=[...dateFields,field('conclusions','Conclusions','textarea',{required:true}),field('limitations','Limits of the available data','textarea'),field('proposed_revision_id','Proposed plan version','select',{nullable:true,options:[{value:'',label:'No proposal'},...loaded.revisions.filter(r=>r.status==='draft').map(r=>({value:r.id,label:`Version ${r.number} · ${r.reason}`}))]}),reasonField];const id=previous?.id||uid();formDialog('Weekly review',fields,{start_date:week,end_date:plus(week,6),reason:'Weekly review',...previous},async v=>{await api(path()+'/reviews','PUT',{...meta(v.reason),...v,id,expected_version:previous?.version||0,plan_revision_id:previous?.plan_revision_id||loaded.cycle.current_revision_id,source_capture_ids:previous?.source_capture_ids||[]});close();await refreshReports();render();notify('Review saved.')})}
function finishCycle(status){const key=uid();formDialog(status==='completed'?'Complete this cycle':'Cancel this cycle',[reasonField],{},async v=>{await api(path()+'/lifecycle','POST',{...meta(v.reason),status,idempotency_key:key});close();await boot(loaded.cycle.id);notify('Cycle '+status+'. Its plan and results remain available.')},'<p>The complete history is retained. You can create a new cycle for your next main event.</p>')}
function changedValues(before,after){const keys=new Set([...Object.keys(before||{}),...Object.keys(after||{})]);return [...keys].filter(k=>k!=='id'&&JSON.stringify(before?.[k])!==JSON.stringify(after?.[k])).map(k=>`<dt>${h(k.replaceAll('_',' '))}</dt><dd>${h(typeof after?.[k]==='object'?JSON.stringify(after[k]):after?.[k]??'Removed')}</dd>`).join('')}
function diffHtml(data){return data.changes.map(c=>`<div class="entry"><h3>${h(c.entity)} · ${h(c.after?.name||c.before?.name||c.after?.date||c.id)}</h3><div class="split"><div class="before"><strong>Before</strong><dl>${c.before?changedValues(c.after,c.before):'<dd>Not present</dd>'}</dl></div><div class="after"><strong>After</strong><dl>${c.after?changedValues(c.before,c.after):'<dd>Removed</dd>'}</dl></div></div></div>`).join('')||'<p>No plan changes.</p>'}
async function showCompare(from,to){const data=await api(path()+`/compare?from_revision_id=${from}&to_revision_id=${to}`);modal('Before → after',`<p>${h(data.reason)}</p>${diffHtml(data)}`)}
async function reviewDraft(id){const saved=await api(path()+'?revision_id='+id);const rev=saved.revision;if(rev.status!=='draft'){await showCompare(rev.parent_revision_id||rev.id,rev.id);return}const data=await api(path()+`/compare?from_revision_id=${loaded.cycle.current_revision_id}&to_revision_id=${id}`);const key=uid();formDialog('Review proposed changes',[field('override_explanation','Explanation for schedule exceptions (if any)','textarea')],{},async v=>{await api(path()+'/drafts/'+id+'/apply','POST',{...meta(rev.reason),expected_draft_version:rev.version,idempotency_key:key,override_explanation:v.override_explanation||null});close();await boot(loaded.cycle.id);notify('Proposed version applied.');},`${saved.warnings.length?`<div class="notice">${saved.warnings.map(w=>h(w.message)).join('<br>')}<p>An explanation is required to apply these exceptions.</p></div>`:''}<p><strong>Reason:</strong> ${h(rev.reason)}</p>${diffHtml(data)}`,'Apply this version')}
function discardDraft(){const rev=loaded.revision,key=uid();formDialog('Discard draft',[reasonField],{},async v=>{await api(path()+'/drafts/'+rev.id+'/discard','POST',{...meta(v.reason),expected_draft_version:rev.version,idempotency_key:key});close();await load(loaded.cycle.id);notify('Draft discarded; its history is retained.')})}
function restoreDraft(){const key=uid(),base=loaded.revision.id;formDialog('Create a new draft from this version',[reasonField],{},async v=>{const result=await api(path()+'/drafts','POST',{...meta(v.reason),base_revision_id:base,idempotency_key:key});close();await load(loaded.cycle.id,result.revision_id)},'<p>Results and notes remain as recorded. Later sessions are retained as cancelled. The comparison shows any dates retained to keep their history consistent.</p>','Create draft')}
async function showAudit(){const data=await api(path()+'/history');modal('Changes to results and notes',data.history.map(e=>`<div class="entry"><h3>${h(e.action.replaceAll('_',' '))}</h3><p>${h(e.detail.reason||'')}</p><span class="compact muted">${h(e.detail.author||'')} · ${h(e.happened_at)}</span>${e.detail.before||e.detail.after?`<div class="split"><div class="before"><dl>${changedValues(e.detail.after,e.detail.before)}</dl></div><div class="after"><dl>${changedValues(e.detail.before,e.detail.after)}</dl></div></div>`:''}</div>`).join('')||'<p>No operational history.</p>')}
function refreshGarmin(){formDialog('Refresh saved Garmin activities',dateFields,{start_date:week>today()?today():week,end_date:plus(week,6)>today()?today():plus(week,6)},async v=>{const res=await fetch('/api/refresh/activities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});const data=await res.json();if(!res.ok||data.status!=='ok')throw new Error(data.message||data.error||`Refresh ${data.status}; inspect source status for details.`);close();await refreshReports();render();notify('Garmin activity refresh completed.')},'<p>This explicitly requests activity records from Garmin for the selected dates. It does not change your plan or publish workouts.</p>','Refresh activities')}
guard(()=>boot());
</script>
</body>
</html>
